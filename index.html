<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to Grassic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D6E9C3;
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* 顶部区域 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px 8px 12px;
        }

        /* Logo */
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #088D5E;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        /* 菜单按钮 */
        .menu {
            width: 22px;
            height: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            display: block;
            width: 100%;
            height: 2px;
            background: #088D5E;
            border-radius: 2px;
        }

        /* 正文 */
        .content {
            padding: 20px;
        }

        .content h1 {
            font-size: 28px;
            font-weight: 700;
            color: #088D5E;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .content p {
            font-size: 15px;
            line-height: 1.6;
            color: #4a5a4e;
        }
    </style>
</head>
<body>

    <header class="header">
        <span class="logo">grassic</span>
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="content">
        <h1>hello</h1>
        <p>welcome to grassic</p>
    </div>

</body>
</html>
