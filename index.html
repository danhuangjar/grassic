<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>welcome to Grassic</title>   
        <style> 
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #D6E9C3;
            }    
            .top-fade {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 30px;
                background: linear-gradient(to bottom, #FFFFFF, #D6E9C3);
            }
            .logo {
                position: absolute;
                top: 20px;
                left: 20px;
                height: 24px;
                width: auto;
            }
        </style>
    </head>
    <body>
        <div class="top-fade"></div>
        <img src="logo.png" alt="Grassic" class="logo">
    </body>
</html>
